# ============================================================
# Troop 2536 site configuration — GitHub Pages (native Jekyll)
# You almost never need to touch this file. Claude Code will
# handle anything in here if a recipe ever calls for it.
# ============================================================

title: "BSA Troop 2536 — Mountain House, CA"
description: "Scouts BSA Troop 2536 in Mountain House, California. Building character, adventure, and leadership."
email: troop2536@gmail.com
url: "https://troop2536-mh.github.io"   # update to https://troop2536.org when the domain is live

# Documents page button target. Replace with the real shareable Drive folder
# URL (share setting: "Anyone with the link can view"). See README Recipe 7.
drive_url: "https://drive.google.com/"

# Announcements live in _announcements/. Underscore-prefixed files there
# (like _TEMPLATE.md) are NEVER treated as announcements — that's the trick
# that keeps the template invisible to the site.
collections:
  announcements:
    output: false

markdown: kramdown

# Files that should never be published as web pages
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - CNAME.example
  - vendor
  - _announcements/_TEMPLATE.md   # the template must NEVER appear on the site
