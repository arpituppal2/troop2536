<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/troop.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%9C%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">⚜</span>
        <span class="brand-text">Troop&nbsp;2536<small>Mountain House, CA</small></span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/schedule/' | relative_url }}" {% if page.url == '/schedule/' %}aria-current="page"{% endif %}>Schedule</a></li>
        <li><a href="{{ '/announcements/' | relative_url }}" {% if page.url == '/announcements/' %}aria-current="page"{% endif %}>Announcements</a></li>
        <li><a href="{{ '/photos/' | relative_url }}" {% if page.url == '/photos/' %}aria-current="page"{% endif %}>Photos</a></li>
        <li><a href="{{ '/documents/' | relative_url }}" {% if page.url == '/documents/' %}aria-current="page"{% endif %}>Documents</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" class="nav-cta" {% if page.url == '/contact/' %}aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <strong>BSA Troop 2536</strong> — Mountain House, California<br>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </div>
      <div class="footer-col footer-small">
        Chartered organization: <span class="todo-inline">TODO(dad)</span><br>
        {{ site.time | date: '%Y' }} · Part of Scouting America · <a href="{{ '/contact/' | relative_url }}">Contact us</a>
      </div>
    </div>
  </footer>
</body>
</html>
